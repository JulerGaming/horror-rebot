<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            /* respect iPhone notch / safe area */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #111;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.78)),
                url("/bg.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            text-align: center;
        }

        h1 {
            margin: 0 16px 8px;
            font-size: 1.8rem;
            line-height: 1.1;
        }

        span {
            display: block;
            margin: 0 16px;
            font-size: 1rem;
        }

        strong.running {
            color: #0f0;
            font-weight: 700;
        }

        /* Small phones (iPhone SE, etc.) */
        @media (max-width: 420px) {
            h1 {
                font-size: 1.4rem;
            }

            span {
                font-size: 0.95rem;
            }

            body {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        /* Larger phones / small tablets */
        @media (min-width: 421px) and (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            span {
                font-size: 1.1rem;
            }

            body {
                background-attachment: scroll;
            }
        }

        .top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #222;
            padding: 8px 16px;
            box-sizing: border-box;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid #444;
            /* left to right order */
            display: flex;
            align-items: center;
        }

        .top img {
            height: 24px;
            margin-right: 8px;
        }

        .top span {
            margin-left: 1px;
            font-size: 1rem;
        }

        .body {
            margin-top: 48px;
            margin-bottom: 16px;
        }

        .log {
            width: 90%;
            height: 300px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .top button {
            all: unset;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .top .redirect-buttons {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .profile {
            margin-top: 24px;
        }

        .profile .activity-status {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .issues {
            /* stack on top of console */
            margin-top: 32px;
            text-align: left;
            max-width: 90%;
            background-color: #1d1d1d;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .console {
            margin-top: 32px;
            background: #0d0d0d;
            color: #d0d0d0;
            font-family: monospace;
            max-width: 90%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 16px;
            height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            text-align: left;
            align-items: flex-start;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        console::-webkit-scrollbar {
            display: none;
        }
    </style>
    <meta charset="utf-8" />
    <title>Bismuth Assistant</title>
    <link rel="icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128"
        sizes="128x128" type="image/png">
    <link rel="apple-touch-icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=256">
    <link rel="shortcut icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128" type="image/png">
    <meta name="theme-color" content="#222">
</head>

<body>
    <div class="top">
        <img src="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=2048"
            alt="Bismuth Assistant Logo" style="height: 24px; vertical-align: middle; margin-right: 8px;" />
        <span>Bismuth Assistant</span>
        <div class="redirect-buttons">
            <button onclick="window.location.href='/'">Home</button>
            <button onclick="window.location.href='/announcements/send/'">Send Announcement</button>
            <button onclick="window.location.href='/tools/'">Tools</button>
            <button onclick="window.location.href='/tools/birthdays/'">Birthdays</button>
        </div>
    </div>
    <div class="body">
        <noscript>
            <div class="issues"
                style="background-color:#8b0000;color:#fff;padding:16px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.5);margin-bottom:16px;">
                <h3 style="margin-top:0;">JavaScript Disabled</h3>
                <ul style="margin:0;padding-left:18px;">
                    <li>JavaScript is disabled in your browser. Console will not update.</li>
                </ul>
            </div>
        </noscript>
        <script>
            // set the server count
            document.addEventListener('DOMContentLoaded', function () {
                const consoleEl = document.getElementById('console');

                const source = new EventSource('/logs');

                source.onmessage = (event) => {
                    const { type, message } = JSON.parse(event.data);

                    const line = document.createElement('div');

                    if (type === "error") {
                        line.style.color = "#ff6b6b";
                        line.textContent = "[ERROR] " + message;
                    } else {
                        line.textContent = "[OUT] " + message;
                    }

                    consoleEl.appendChild(line);

                    // auto-scroll
                    consoleEl.scrollTop = consoleEl.scrollHeight;

                    // prevent infinite growth
                    if (consoleEl.children.length > 500) {
                        consoleEl.removeChild(consoleEl.firstChild);
                    }
                };
            });
        </script>
        <h1>Console Log</h1>
        <div class="console" id="console">
            <!-- Console output will appear here -->
        </div>
    </div>
</body>

</html>
