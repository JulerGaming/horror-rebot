<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/tools/notifications.css" />
    <script src="/tools/notifications.js" defer></script>
    <link rel="stylesheet" href="/style.css" />
    <script>
        // Stub that queues calls until `/tools/notifications.js` is ready.
        window.sendNotification = window.sendNotification || function () {
            window.__queuedNotifications = window.__queuedNotifications || [];
            window.__queuedNotifications.push(Array.from(arguments));
        };

        function goHome() {
            window.location.href = "/";
        }

        function rs() {
            if (!confirm('Are you sure you want to restart the bot?')) {
                return;
            }
            fetch('/tools/restart', {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    sendNotification('Restarting bot... This server is unavailable until the bot starts.', 'success');
                } else {
                    sendNotification('Failed to send restart command.', 'error');
                }
            }).catch(error => {
                sendNotification('Error: ' + error, 'error');
            });
        }

        function rssv() {
            if (!confirm('Are you sure you want to restart the server?')) {
                return;
            }
            fetch('/tools/restart-server', {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    sendNotification('Restarting server... This server is unavailable until it starts back up.', 'success');
                } else {
                    sendNotification('Failed to send restart command.', 'error');
                }
            }).catch(error => {
                sendNotification('Error: ' + error, 'error');
            });
        }

        function toggleChatGPT() {
            const enabled = document.getElementById('chatgpt-toggle').checked;
            fetch('/tools/chatgpt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ enabled })
            }).then(response => {
                if (response.ok) {
                    sendNotification('ChatGPT integration ' + (enabled ? 'enabled' : 'disabled') + '.', 'success');
                } else {
                    sendNotification('Error updating ChatGPT status.', 'error');
                }
            }).catch(error => {
                sendNotification('Error: ' + error, 'error');
            });
        }

        function ToggleVCRelatedStuff() {
            const enabled = document.getElementById('vc-toggle').checked;
            fetch('/tools/vc', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ enabled })
            }).then(response => {
                if (response.ok) {
                    sendNotification('VC related features ' + (enabled ? 'enabled' : 'disabled') + '.');
                } else {
                    sendNotification('Error updating VC status.', 'error');
                }
            }).catch(error => {
                sendNotification('Error: ' + error, 'error');
            });
        }

        function ToggleAIMod() {
            const enabled = document.getElementById('aimod-toggle').checked;
            fetch('/tools/aimoderation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ enabled })
            }).then(response => {
                if (response.ok) {
                    sendNotification('AI moderation ' + (enabled ? 'enabled' : 'disabled') + '.', 'success');
                } else {
                    sendNotification('Error updating AI moderation status.', 'error');
                }
            }).catch(error => {
                sendNotification('Error: ' + error, 'error');
            });
        }

        // Fetch the current ChatGPT integration status on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/chatgpt-status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('chatgpt-toggle').checked = data.enabled;
                })
                .catch(error => {
                    console.error('Error fetching ChatGPT status:', error);
                });
            fetch('/vc-status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('vc-toggle').checked = data.enabled;
                })
                .catch(error => {
                    console.error('Error fetching VC status:', error);
                })
            fetch('/aimoderation-status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('aimod-toggle').checked = data.enabled;
                })
                .catch(error => {
                    console.error('Error fetching AI Moderation status:', error);
                })
        });
    </script>
    <meta charset="utf-8" />
    <title>Bismuth Assistant</title>
    <link rel="icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128"
        sizes="128x128" type="image/png">
    <link rel="apple-touch-icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=256">
    <link rel="shortcut icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128" type="image/png">
    <meta name="theme-color" content="#222">
</head>

<body>
    <div class="top">
        <img src="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=2048"
            alt="Bismuth Assistant Logo">
        <span>Bismuth Assistant - Tools</span>
        <div class="redirect-buttons">
            <button onclick="window.location.href='/'">Home</button>
            <button onclick="window.location.href='/announcements/send/'">Send Announcement</button>
            <button onclick="window.location.href='/tools/'">Tools</button>
            <button onclick="window.location.href='/tools/birthdays/'">Birthdays</button>
            <button onclick="window.location.href='/console/'">Console</button>
        </div>
    </div>
    <div class="body">
        <h1>Tools</h1>
        <span>Allows you to configure the bot.</span>
        <div class="list">
            <button onclick="rs()">Restart</button>
            <button onclick="rssv()">Restart Server</button>
            <label>
                <input type="checkbox" id="chatgpt-toggle" onchange="toggleChatGPT()" />
                Enable ChatGPT Integration
            </label>
            <label>
                <input type="checkbox" id="vc-toggle" onchange="ToggleVCRelatedStuff()" />
                Enable Voice Related Stuff
            </label>
            <label>
                <input type="checkbox" id="aimod-toggle" onchange="ToggleAIMod()" />
                Enable AI Moderation
            </label>
        </div>
    </div>

</html>
