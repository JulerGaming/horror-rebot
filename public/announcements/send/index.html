<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/announcements/send/style.css" />
    <script>
        function goHome() {
            window.location.href = "/";
        }

        function sendAnnouncement() {
            const title = document.getElementById("announcement-title").value.trim();
            const content = document.getElementById("announcement-content").value.trim();

            if (!title || !content) {
                alert("Please fill in both the title and content fields.");
                return;
            }

            fetch("/send-announcement", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    content: content,
                    pingEveryone: document.getElementById("ping-everyone").checked
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Announcement sent successfully!");
                        document.getElementById("announcement-title").value = "";
                        document.getElementById("announcement-content").value = "";
                    } else {
                        alert("Failed to send announcement: " + data.error);
                    }
                })
                .catch(error => {
                    console.error("Error sending announcement:", error);
                    alert("An error occurred while sending the announcement.");
                });
        }
    </script>
    <meta charset="utf-8" />
    <title>Bismuth Assistant</title>
    <link rel="icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128"
        sizes="128x128" type="image/png">
    <link rel="apple-touch-icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=256">
    <link rel="shortcut icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128" type="image/png">
    <meta name="theme-color" content="#222">
</head>

<body>
    <div class="top">
        <img src="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=2048"
            alt="Bismuth Assistant Logo">
        <span>Bismuth Assistant - Send Announcement</span>
        <div class="redirect-buttons">
            <button onclick="window.location.href='/'">Home</button>
            <button onclick="window.location.href='/announcements/send/'">Send Announcement</button>
            <button onclick="window.location.href='/tools/'">Tools</button>
            <button onclick="window.location.href='/tools/birthdays/'">Birthdays</button>
            <button onclick="window.location.href='/console/'">Console</button>
        </div>
    </div>
    <div class="body">
        <h1>Send Announcement</h1>
        <div class="list">
            <label>
                <input type="checkbox" id="ping-everyone" />
                Ping Everyone
            </label>
            <input type="text" id="announcement-title" placeholder="Title..."
                style="width: 80%; padding: 8px; font-size: 1rem; border-radius: 4px; border: none; box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);">
            <textarea id="announcement-content" placeholder="Content..." rows="3" maxlength="1000"
                style="width: 80%; padding: 8px; font-size: 1rem; border-radius: 4px; border: none; box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); margin-top: 12px;"></textarea>
            <button onclick="sendAnnouncement()"
                style="margin-top: 16px; padding: 10px 20px; font-size: 1rem; border-radius: 4px; border: none; background-color: #0f0; color: #000; font-weight: 700; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);">Send
                Announcement</button>
        </div>
    </div>

</html>
