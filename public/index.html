<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css" />
    <meta charset="utf-8" />
    <title>Bismuth Assistant</title>
    <link rel="icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128"
        sizes="128x128" type="image/png">
    <link rel="apple-touch-icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=256">
    <link rel="shortcut icon"
        href="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=128" type="image/png">
    <meta name="theme-color" content="#222">
</head>

<body>
    <div class="top">
        <img src="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=2048"
            alt="Bismuth Assistant Logo" style="height: 24px; vertical-align: middle; margin-right: 8px;" />
        <span>Bismuth Assistant</span>
        <div class="redirect-buttons">
            <button onclick="window.location.href='/'">Home</button>
            <button onclick="window.location.href='/announcements/send/'">Send Announcement</button>
            <button onclick="window.location.href='/tools/'">Tools</button>
            <button onclick="window.location.href='/tools/birthdays/'">Birthdays</button>
            <button onclick="window.location.href='/console/'">Console</button>
        </div>
    </div>
    <div class="body">
        <noscript>
            <div class="issues"
                style="background-color:#8b0000;color:#fff;padding:16px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.5);margin-bottom:16px;">
                <h3 style="margin-top:0;">JavaScript Disabled</h3>
                <ul style="margin:0;padding-left:18px;">
                    <li>JavaScript is disabled in your browser. Live server count and bot activity require JavaScript to
                        function. Please enable JavaScript and reload the page.</li>
                </ul>
            </div>
        </noscript>
        <script>
            // Helper function to add an issue to the issues list
            function addIssue(text) {
                var issuesEl = document.querySelector('.issues ul');
                if (issuesEl) {
                    var li = document.createElement('li');
                    li.textContent = text;
                    issuesEl.appendChild(li);
                }
            }

            // set the server count
            document.addEventListener('DOMContentLoaded', function () {
                // Fetch server/member count from Discord's public guild widget.
                // Replace GUILD_ID with your guild's ID and ensure the widget is enabled in server settings.
                var guildId = '1333194010201952367';
                var url = 'https://discord.com/api/guilds/' + guildId + '/widget.json';

                fetch(url, { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (data) {
                        var count = 'N/A';
                        if (Array.isArray(data.members) && data.members.length) {
                            count = data.members.length;
                        }

                        var spans = document.getElementsByTagName('span');
                        for (var i = 0; i < spans.length; i++) {
                            if (spans[i].textContent.startsWith('Server count:')) {
                                spans[i].innerHTML = 'Server count: <strong class="running">' + count + '</strong> online members';
                                break;
                            }
                        }
                    })
                    .catch(function (err) {
                        console.error('Could not load server count from Discord API:', err);
                        addIssue('Could not load server count from Discord API.');
                    });

                // Attempt to get bot activity via the guild widget (avoids exposing bot token and CORS issues)
                fetch('/presence', { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) {
                            throw new Error('HTTP ' + r.status);
                        }
                        return r.json();
                    })
                    .then(function (data) {
                        var activityText = 'No activity';
                        if (data.activities && data.activities.length > 0) {
                            var activity = data.activities[0];
                            activityText = activity.name;
                            if (activity.type) {
                                // activityText = the thing your doing
                                if (activity.type == 0) {
                                    "Playing" + ' ' + activityText; // Playing
                                } else if (activity.type == 1) {
                                    "Streaming" + ' ' + activityText; // Streaming
                                } else if (activity.type == 2) {
                                    "Listening" + ' ' + activityText; // Listening
                                } else if (activity.type == 3) {
                                    "Watching" + ' ' + activityText; // Watching
                                }
                            }
                        }
                        var presenceText = 'Not available';
                        if (data.status) {
                            presenceText = data.status;
                        }

                        var presenceSpan = document.getElementById('presence-text');
                        var activitySpan = document.getElementById('activity-text');

                        if (presenceText === 'online') {
                            presenceText = 'Online';
                        } else if (presenceText === 'idle') {
                            presenceText = 'Idle';
                        } else if (presenceText === 'dnd') {
                            presenceText = 'Do Not Disturb';
                        } else if (presenceText === 'offline') {
                            presenceText = 'Offline';
                        }

                        if (presenceSpan) {
                            presenceSpan.textContent = presenceText;
                        }
                        if (activitySpan) {
                            activitySpan.textContent = activityText;
                        }
                    })
                    .catch(function (err) {
                        console.error('Could not load bot activity:', err);
                        addIssue('Could not load bot activity.');
                    });
                // check if theres internet connection, if not, then create an issue
                if (!navigator.onLine) {
                    addIssue('No internet connection detected.');
                }
                // populate issues from the issues.json file generated by the bot
                fetch('/issues.txt', { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.text();
                    })
                    .then(function (text) {
                        if (text === "") {
                            addIssue('You\'re all clear! ;)');
                            return;
                        }
                        text.split('\n').forEach(function (line) {
                            if (line.trim()) {
                                addIssue(line.trim());
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error('Could not load issues from issues.txt:', err);
                        addIssue('Could not load issues from server.');
                    });
            });
        </script>
        <h1>Bismuth Assistant</h1>
        <span>Server count: <strong>- N/A -</strong> online members</span>
        <div class="profile">
            <!--and here goes a replica of the discord profile view-->
            <img src="https://cdn.discordapp.com/avatars/1369007178664378429/bd38919e372414218473dd8310396ae7.png?size=256"
                alt="Bismuth Assistant Profile Picture" style="height: 128px; width: 128px; border-radius: 16px;" />
            <h2>Bismuth Assistant<strong style="color: #696969; font-weight: 400;"> #4605</strong></h2>
            <div class="activity-status" style="display: flex; align-items: center; gap: 8px; justify-content: center;">
                <div
                    style="width: 12px; height: 12px; background-color: #43b581; border-radius: 50%; border: 2px solid #2c2f33;">
                </div>
                <span id="presence-text">Online</span>
                <span id="activity-text">Loading...</span>
            </div>
        </div>
        <!--Shows warnings and errors-->
        <div class="issues">
            <h3>Issues</h3>
            <ul>
                <!-- Issues will be populated here by JavaScript -->
            </ul>
        </div>
    </div>
</body>

</html>
